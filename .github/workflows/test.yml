name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['30.1']
    steps:
      - uses: actions/checkout@v4

      # eas.el, the chart engine, beside this repository
      - uses: actions/checkout@v4
        with:
          repository: davidawad/eas.el
          path: eas.el

      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Tests
        run: make test EAS=eas.el

      - name: Byte-compile (warnings are errors)
        run: make compile EAS=eas.el

      - name: Checkdoc
        run: make checkdoc

      - name: Shell door
        run: |
          EAS=eas.el bin/health-chart templates > /dev/null
          EAS=eas.el bin/health-chart example vitals-trend --raw > /tmp/vitals.json
          EAS=eas.el bin/health-chart validate vitals-trend --data /tmp/vitals.json
          EAS=eas.el bin/health-chart render vitals-trend --data /tmp/vitals.json --backend text --raw
