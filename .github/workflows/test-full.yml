# Optional full OS x Emacs matrix; the fast default is test.yml.
name: test full matrix

on:
  # Optional: the slow cross-platform matrix. Push/PR runs test.yml (one fast job).
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * 1"

jobs:
  test:
    name: ${{ matrix.os }} / Emacs ${{ matrix.emacs_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        emacs_version: ['29.1', '30.1']
        include:
          - os: ubuntu-latest
            emacs_version: snapshot
    defaults:
      run:
        # Git Bash on Windows; make is not assumed there
        shell: bash
    steps:
      - name: Keep LF line ends on Windows
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # purcell/setup-emacs on Linux and macOS, setup-emacs-windows on Windows
      - uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Render tools.  The tests skip what is absent, so these steps only
      # decide how much rendering each leg really exercises.
      - name: Install gnuplot and rsvg-convert (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnuplot-nox librsvg2-bin fonts-dejavu-core

      - name: Install gnuplot and rsvg-convert (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: brew install gnuplot librsvg

      - name: Install gnuplot (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        # lands in "C:\Program Files\gnuplot\bin", which
        # health-chart-tool-directories searches
        run: choco install gnuplot --no-progress -y

      - name: Install Vega-Lite (vl2svg, vl2png)
        continue-on-error: ${{ runner.os != 'Linux' }}
        run: npm install -g vega vega-lite vega-cli

      - name: Show tools
        run: |
          emacs --version | head -n 1
          emacs -Q --batch -L . -l health-chart-batch -f health-chart-batch-main backends

      - name: Run tests (make)
        if: runner.os != 'Windows'
        run: make test

      - name: Run tests (no make)
        if: runner.os == 'Windows'
        run: emacs -Q --batch -l test/run-tests.el

      - name: Byte-compile
        run: emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile health-chart*.el

      - name: Checkdoc
        if: runner.os == 'Linux'
        run: make checkdoc

      - name: Package-lint
        if: runner.os == 'Linux'
        run: |
          emacs -Q --batch --eval "(progn (require 'package) (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t) (package-initialize) (package-refresh-contents) (package-install 'package-lint))"
          make lint PACKAGE_LINT="$(ls -d ~/.emacs.d/elpa/package-lint-*)"

      - name: CLI smoke test
        if: runner.os != 'Windows'
        run: |
          bin/health-chart example bullet | bin/health-chart render -
          bin/health-chart pipe heatmap < test/fixtures/biomarker-query.json

      - name: CLI smoke test (cmd.exe)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call bin\health-chart.cmd example bullet > "%RUNNER_TEMP%\bullet.json" || exit /b 1
          call bin\health-chart.cmd render "%RUNNER_TEMP%\bullet.json" || exit /b 1
          call bin\health-chart.cmd pipe heatmap < test\fixtures\biomarker-query.json || exit /b 1
